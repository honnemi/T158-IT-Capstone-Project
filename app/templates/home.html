{% extends 'base.html' %} {% block title %} Home {% endblock %}
{% block styles %}
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/e57688c40b.js" crossorigin="anonymous"></script>
{% endblock %}

{% block content %}
<body>
  <div class="container">
    <h1 class="mb-4">Home</h1>
    <h3 class="mb-4">Planned Trips:</h3>

    <div class="row">
      <div class="col-12">
        <div class="card shadow-sm" style="height: 300px;">
          <div class="card-body d-flex flex-row justify-content-between align-items-center">
            <div id="trip-info">
              <h3 class="card-title">Trip to Korea</h3>
              <div class="d-flex align-items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-calendar" viewBox="0 0 16 16">
                <path d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5M1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4z"/>
                </svg>
                <p class="text-muted">8th Nov - 22nd Nov</p>
              </div>
                <div class="d-flex align-items-center gap-2">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person" viewBox="0 0 16 16">
                  <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
                  </svg>
                  <p class="text-muted">People</p>
                </div>
              <a href="{{ url_for('main.show_itinerary_overview') }}"><button class="btn btn-primary">Continue Planning</button></a>
          </div>
          <img class="card-img" src="./static/images/southkorea.jpg" alt="South Korea" style="width:50%; height:250px; object-fit:fill;">
        </div>
      </div>
    </div>
  </div>
</body>
{% endblock content %}
