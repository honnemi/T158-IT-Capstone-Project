{% extends 'base.html' %} {% block title %} Inspo {% endblock %}
{% block active_tab %}
<a href="{{ url_for('main.show_itinerary_overview') }}" class="nav-tab">Itinerary</a>
<a href="{{ url_for('main.show_flights') }}" class="nav-tab">Bookings</a>
<a href="{{ url_for('main.show_inspo') }}" class="nav-tab active">Inspo</a>
<a href="{{ url_for('main.show_budget') }}" class="nav-tab">Budget</a>
{% endblock %}

{% block content %}
<main>
    <div class="container-fluid py-4 mt-3">
    <div class="row justify-content-center mb-2 ">
        <div class="col-2 d-flex justify-content-center align-items-center">
            <!--Tools-->
            <div class="toolbar d-flex flex-column align-items-center gap-2">
                <button id="pen" class="tool btn btn-primary-outline">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pen-fill" viewBox="0 0 16 16">
                    <path d="m13.498.795.149-.149a1.207 1.207 0 1 1 1.707 1.708l-.149.148a1.5 1.5 0 0 1-.059 2.059L4.854 14.854a.5.5 0 0 1-.233.131l-4 1a.5.5 0 0 1-.606-.606l1-4a.5.5 0 0 1 .131-.232l9.642-9.642a.5.5 0 0 0-.642.056L6.854 4.854a.5.5 0 1 1-.708-.708L9.44.854A1.5 1.5 0 0 1 11.5.796a1.5 1.5 0 0 1 1.998-.001"/>
                    </svg>
                </button>
                <button id="eraser" class="tool btn btn-primary-outline">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eraser-fill" viewBox="0 0 16 16">
                    <path d="M8.086 2.207a2 2 0 0 1 2.828 0l3.879 3.879a2 2 0 0 1 0 2.828l-5.5 5.5A2 2 0 0 1 7.879 15H5.12a2 2 0 0 1-1.414-.586l-2.5-2.5a2 2 0 0 1 0-2.828zm.66 11.34L3.453 8.254 1.914 9.793a1 1 0 0 0 0 1.414l2.5 2.5a1 1 0 0 0 .707.293H7.88a1 1 0 0 0 .707-.293z"/>
                    </svg>
                </button>
                <button id="square" class="tool btn btn-primary-outline">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-square" viewBox="0 0 16 16">
                    <path d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z"/>
                    </svg>
                </button>
                <button id="circle" class="tool btn btn-primary-outline">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-circle" viewBox="0 0 16 16">
                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                    </svg>
                </button>
                <button id="arrow" class="tool btn btn-primary-outline">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-up-right" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M14 2.5a.5.5 0 0 0-.5-.5h-6a.5.5 0 0 0 0 1h4.793L2.146 13.146a.5.5 0 0 0 .708.708L13 3.707V8.5a.5.5 0 0 0 1 0z"/>
                    </svg>
                </button>
                <button id="text" class="tool btn btn-primary-outline">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-fonts" viewBox="0 0 16 16">
                    <path d="M12.258 3h-8.51l-.083 2.46h.479c.26-1.544.758-1.783 2.693-1.845l.424-.013v7.827c0 .663-.144.82-1.3.923v.52h4.082v-.52c-1.162-.103-1.306-.26-1.306-.923V3.602l.431.013c1.934.062 2.434.301 2.693 1.846h.479z"/>
                    </svg>
                </button>
                <button id="image" class="tool btn btn-primary-outline" title="Upload Image">
                    <svg xmlns="http://w3.org" width="16" height="16" fill="currentColor" class="bi bi-image" viewBox="0 0 16 16">
                        <path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/>
                        <path d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2h-12zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1h12z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!--Whiteboard space-->
        <div class="col-8 d-flex justify-content-center align-items-center">
            <div class="whiteboard-container border border-2 rounded w-100">
                <canvas id="whiteboard"></canvas>
            </div>
        </div>

        <!--Colour swatches-->
        <div class="col-2 d-flex justify-content-center align-items-center">
            <div class="toolbar d-flex flex-column align-items-center gap-2">
                <button id="black" class="colour btn btn-primary-outline" data-color="#1F2937"></button>
                <button id="red" class="colour btn btn-primary-outline" data-color="#EF4444"></button>
                <button id="orange" class="colour btn btn-primary-outline" data-color="#F97316"></button>
                <button id="yellow" class="colour btn btn-primary-outline" data-color="#FACC15"></button>
                <button id="green" class="colour btn btn-primary-outline" data-color="#22C55E"></button>
                <button id="blue" class="colour btn btn-primary-outline" data-color="#3B82F6"></button>
                <button id="purple" class="colour btn btn-primary-outline" data-color="#8B5CF6"></button>
                <button id="pink" class="colour btn btn-primary-outline" data-color="#EC4899"></button>
                <button id="cyan" class="colour btn btn-primary-outline" data-color="#06B6D4"></button>
            </div>
        </div>
    </div>
</main>

<!--Hidden image upload-->
<input type="file" id="image-loader" accept="image/*" style="display: none;">

{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<!--Link to Fabric.js for whiteboard functionality-->
<script src="https://cdn.jsdelivr.net/npm/fabric@6.4.3/dist/index.js"></script>
<script src="{{ url_for('static', filename='js/whiteboard.js') }}"></script>
{% endblock %}
