<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Travel Planner{% endblock %}</title>
    
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
    <!-- link to bootstrap -->    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet">

</head>

<body class="no-scrollbar">
<!-- ======================================== -->
<!-- TOP NAVIGATION BAR -->
<!-- ======================================== -->
<nav class="navbar d-flex align-items-center">

    <!-- Hamburger menu -->
     <button class="navbar-toggler menu-btn justify-content-between" 
        type="button" 
        data-bs-toggle="offcanvas" 
        data-bs-target="#offcanvasNavbar" 
        aria-controls="offcanvasNavbar" 
        aria-label="Toggle navigation">
      <svg xmlns="http://www.w3.org/2000/svg" 
        width="40" 
        height="40" 
        fill="currentColor" 
        class="bi bi-list" 
        viewBox="0 0 16 16">
        <path 
        fill-rule="evenodd" 
        d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
      </svg>
    </button>

    <!-- Main navigation tabs -->
    <div class="nav-tabs-custom d-flex flex-grow-1">
        {% block active_tab %}
        <a href="{{ url_for('itinerary.show_itinerary_overview') }}" class="nav-tab">Itinerary</a>
        <a href="{{ url_for('bookings.show_flights') }}" class="nav-tab">Bookings</a>
        <a href="{{ url_for('inspo.show_inspo') }}" class="nav-tab">Inspo</a>
        <a href="{{ url_for('budget.show_budget') }}" class="nav-tab">Budget</a>
        {% endblock %}
    </div>
</nav>

    <div class="offcanvas offcanvas-start text-bg-light" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
        <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Interactive Planner</h5>
        <button type="button" class="btn-close btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
        <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-person-circle me-2"></i>
                  User
                </a>
                <ul class="dropdown-menu">
                  <li><a class="dropdown-item" href="#">My Account Details</a></li>
                  <li><a class="dropdown-item" href="#">Settings</a></li>
                  <li>
                    <hr class="dropdown-divider">
                  </li>
                  <li><a class="dropdown-item" href="#"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                </ul>
              </li>
            <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="{{ url_for('home.show_home') }}">
                <i class="bi bi-house-fill me-2"></i>
                Home
            </a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="#">
                <i class="bi bi-telephone-fill me-2"></i>
                Contact us
            </a>
            </li>
        </ul>
        </div>
    </div>
    
<!-- Dark navbar end-->
    
    {% block content %}
    {% endblock %}

    {% block scripts %}
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>
    {% endblock %}

</body>
</html>
