<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="auth-body">

    <div class="auth-page">

        <!-- Card -->
        <div class="auth-card">
            <h1 class="auth-title">Forgot Password</h1>

            <p class="auth-subtext">
                Please enter the email address you would like your recovery information sent to.
            </p>

            <form class="auth-form" method="POST" action="{{ url_for('main.show_forgot_password') }}">

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <button type="submit" class="auth-btn">Send Email</button>

                <a href="{{ url_for('main.show_login') }}" class="auth-btn-secondary">Back to Login</a>

            </form>
        </div>

    </div>

</body>
</html>
